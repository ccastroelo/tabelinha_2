# Codemagic CI/CD do Tabelinha.
#
# O arquivo precisa ficar na raiz do repositório. O projeto Flutter está em
# app-flutter/: por isso `working_directory` (onde os scripts rodam) e o prefixo
# `app-flutter/` nos `artifacts` (esses caminhos são relativos à raiz do repositório).
#
# Antes do primeiro build, crie no painel do Codemagic os itens abaixo, com
# exatamente estes nomes (passo a passo em app-flutter/README.md, "CI/CD"):
#   - integração App Store Connect ......... tabelinha_asc
#   - keystore Android (code signing) ...... tabelinha_keystore
# A publicação automática no Google Play fica desligada: o app ainda não existe no Play
# Console. Depois da primeira versão enviada à mão, ligue-a (bloco comentado em android-release).
#
# Gatilhos:
#   - tests ........ pull request para main e push na main
#   - *-release .... tag v* (ex.: v4.0.0) ou início manual no painel
#
# Todos usam mac_mini_m2, que o plano gratuito cobre (500 min/mês). linux_x2 é mais
# barato, mas exige cobrança ativada; se ativar, troque nos workflows tests e android-release.

workflows:
  tests:
    name: Testes (analyze + test)
    instance_type: mac_mini_m2
    max_build_duration: 20
    working_directory: app-flutter
    environment:
      flutter: 3.44.4
    triggering:
      events:
        - pull_request
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: false
      cancel_previous_builds: true
    scripts:
      - name: Dependências
        script: flutter pub get
      - name: Análise estática
        script: flutter analyze
      - name: Testes
        script: flutter test

  android-release:
    name: Android (AAB assinado)
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: app-flutter
    environment:
      flutter: 3.44.4
      android_signing:
        - tabelinha_keystore
      vars:
        PACKAGE_NAME: br.eti.claudiocastro.tabelinha
      # Para ligar a publicação (e a consulta do último versionCode), depois que a primeira
      # versão estiver no Play Console: crie o grupo de variáveis `google_play` com a variável
      # secreta GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS e descomente:
      # groups:
      #   - google_play
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Dependências
        script: flutter pub get
      - name: Testes
        script: flutter test
      - name: Gerar o AAB assinado
        script: |
          # versionCode: o contador de builds do Codemagic. Com a conta do Google Play ligada
          # (grupo google_play), vale o maior entre ele e "último do Play + 1"; se a consulta
          # falhar ou não houver versões, fica o contador.
          NEXT=$BUILD_NUMBER
          if [ -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS:-}" ]; then
            LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null | tail -n 1 | grep -E '^[0-9]+$' || true)
            if [ $(( ${LATEST:-0} + 1 )) -gt "$NEXT" ]; then NEXT=$(( LATEST + 1 )); fi
          fi
          echo "versionCode: $NEXT"
          flutter build appbundle --release --build-number=$NEXT
    artifacts:
      # Baixe o .aab aqui para a primeira publicação manual no Play Console.
      - app-flutter/build/**/outputs/**/*.aab
      - app-flutter/build/**/outputs/**/mapping.txt
    # Publicação automática: descomente junto com o grupo google_play, só depois que a
    # primeira versão (enviada à mão) existir no Play Console.
    # publishing:
    #   google_play:
    #     credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     # Rascunho: nada vai para os testadores sem você liberar no Play Console.
    #     submit_as_draft: true

  ios-release:
    name: iOS (App Store Connect / TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: app-flutter
    integrations:
      app_store_connect: tabelinha_asc
    environment:
      flutter: 3.44.4
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.eti.claudiocastro.tabelinha
      vars:
        # ID numérico do app no App Store Connect (Informações do app > ID da Apple).
        # Veio de um comentário do iRate no código antigo: confirme antes do primeiro build.
        APP_STORE_APPLE_ID: 595717748
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Configurar a assinatura no projeto Xcode
        script: xcode-project use-profiles
      - name: Dependências
        script: flutter pub get
      - name: Instalar pods (só se houver Podfile)
        script: find . -name "Podfile" -execdir pod install \;
      - name: Testes
        script: flutter test
      - name: Gerar o IPA
        script: |
          # Número do build: o maior entre "último do App Store Connect + 1" e o contador
          # do Codemagic. Se a consulta falhar ou não devolver um inteiro, vale o contador.
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -n 1 | grep -E '^[0-9]+$' || true)
          NEXT=$(( ${LATEST:-0} + 1 ))
          if [ "$NEXT" -lt "$BUILD_NUMBER" ]; then NEXT=$BUILD_NUMBER; fi
          echo "build number: $NEXT"
          flutter build ipa --release \
            --build-number=$NEXT \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - app-flutter/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Só envia o build ao App Store Connect/TestFlight. Publicar na loja
        # continua sendo um passo seu, no App Store Connect.
        submit_to_app_store: false
